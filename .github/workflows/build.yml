name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        shell: bash
        run: gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
      - name: Show build errors
        if: failure()
        shell: bash
        run: |
          grep -E '^e: |error:|What went wrong|Execution failed|AAPT|Could not' -A1 build.log | head -8 | while IFS= read -r l; do echo "::error::${l}"; done
      - uses: actions/upload-artifact@v4
        with:
          name: TempoShift-apk
          path: app/build/outputs/apk/debug/app-debug.apk
